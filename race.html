<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Гонка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#11131a; --road:#23262f; --line:#4a4f5c; --ink:#f2f3f5; --dim:#9aa0ad;
    --accent:#48b0ff; --bad:#ff5a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none}

  .hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;
    display:flex;justify-content:space-between;padding:0 18px;
    font-variant-numeric:tabular-nums;pointer-events:none}
  .hud b{font-size:26px;font-weight:700}
  .hud span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .hud .right{text-align:right}

  .panel{position:fixed;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:28px;
    background:rgba(17,19,26,.94);backdrop-filter:blur(6px);text-align:center}
  .panel.on{display:flex}
  .panel h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .panel p{color:var(--dim);max-width:19em;font-size:15px}
  .big{font-size:58px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .best{color:var(--dim);font-size:14px}
  button{appearance:none;border:0;border-radius:14px;padding:15px 34px;
    font-size:17px;font-weight:600;color:#08111c;background:var(--accent);
    cursor:pointer;transition:transform .08s}
  button:active{transform:scale(.97)}
  button.ghost{background:transparent;color:var(--dim);
    box-shadow:inset 0 0 0 1px var(--line);padding:12px 26px;font-size:15px}
  .hint{font-size:13px;color:var(--dim)}
  .saved{font-size:13px;min-height:1.2em;color:var(--accent)}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div class="hud" id="hud" style="display:none">
  <div><span>Счёт</span><b id="score">0</b></div>
  <div class="right"><span>Рекорд</span><b id="hi">0</b></div>
</div>

<div class="panel on" id="start">
  <h1>🏎 Гонка</h1>
  <p>Уворачивайтесь от встречных. Чем дальше — тем быстрее.</p>
  <button id="go">Поехали</button>
  <div class="hint">Слева / справа по экрану — или стрелками</div>
</div>

<div class="panel" id="over">
  <h1>Приехали</h1>
  <div class="big" id="final">0</div>
  <div class="best" id="bestline"></div>
  <div class="saved" id="saved"></div>
  <button id="again">Ещё раз</button>
  <button class="ghost" id="close">Выйти</button>
</div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#11131a"); } catch(e){} }

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);

// --- размеры. Играем в вертикальном поле 360x640, вписанном в экран,
//     чтобы механика не зависела от диагонали телефона.
const W = 360, H = 640;
let scale = 1;
function fit(){
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fit); fit();

// --- поле
const LANES = 3, ROAD_W = 300, ROAD_X = (W - ROAD_W) / 2;
const laneX = i => ROAD_X + ROAD_W / LANES * (i + .5);
const CAR_W = 54, CAR_H = 92;

// Хранилище может быть запрещено настройками браузера или вебвью, и тогда
// само обращение к нему бросает исключение. Без обёртки одна такая строка
// роняет весь скрипт, и игра не запускается вовсе.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

let state = "menu", score = 0, best = +(store.get("race_best") || 0);
let lane = 1, carX = laneX(1), speed = 0, dist = 0, dash = 0;
let cars = [], spawnIn = 0, last = 0;

// Настоящие автомобильные цвета, а не радуга: белый, серебро, графит,
// красный, синий, зелёный, песок.
const PALETTE = ["#e8eaee","#b6bcc6","#3c4048","#c9382f","#2f5fa8","#2f6b4f","#c9a15a"];

// Типы кузова. Габарит у всех один — от него зависит столкновение, и разный
// размер при одинаковой зоне удара воспринимался бы как обман. Различаются
// силуэтом: где кабина, насколько сужается нос, чем занята корма.
const BODIES = [
  { name:"седан",      cabin:[.30,.68], cabW:.86, noseF:.88, noseR:.94, r:9 },
  { name:"спорткар",   cabin:[.26,.56], cabW:.80, noseF:.78, noseR:1.0, r:7, wing:true },
  { name:"внедорожник",cabin:[.24,.74], cabW:.92, noseF:.95, noseR:.97, r:5, rails:true },
  { name:"пикап",      cabin:[.20,.52], cabW:.88, noseF:.92, noseR:.96, r:6, bed:true },
  { name:"фургон",     cabin:[.14,.44], cabW:.94, noseF:.96, noseR:.98, r:5, tall:true },
];

// Скорость растёт до потолка, а не бесконечно: без него через две минуты
// машина проходит экран быстрее, чем человек успевает моргнуть.
const SPEED0 = 250, SPEED_MAX = 760, ACCEL = 8;
// Расстояние между волнами держим в пикселях, а не в секундах: тогда с
// ростом скорости сокращается время на реакцию, а не плотность движения.
// Сверх того промежуток немного сужается — иначе на потолке скорости гонка
// перестаёт заканчиваться, а бесконечная гонка не гонка.
const GAP_MAX = 320, GAP_MIN = 215, GAP_K = .2;
const gapPx = () => Math.max(GAP_MIN, GAP_MAX - (speed - SPEED0) * GAP_K);

let gapLane = 1;

function reset(){
  score = 0; lane = 1; carX = laneX(1); speed = SPEED0; dist = 0;
  cars = []; gapLane = 1; spawnIn = .5; last = performance.now();
}

function spawn(){
  // Волна — стена ровно с одним проходом, и проход смещается не больше чем
  // на полосу. Только так гонка честна: игрок, идущий по проходу, всегда
  // достаёт следующий одним движением.
  //
  // Оставлять вторую свободную полосу нельзя, хотя это и выглядит проще:
  // она приводит туда, откуда следующий проход уже не достать, и участок
  // становится непроезжим — сколько бы игрок ни старался.
  const step = Math.random() < .7 ? (Math.random() < .5 ? -1 : 1) : 0;
  gapLane = Math.max(0, Math.min(LANES - 1, gapLane + step));

  if (Math.random() < .15) return;      // редкая пустая волна — передышка

  for (let l = 0; l < LANES; l++){
    if (l === gapLane) continue;
    cars.push({
      lane: l, y: -CAR_H,
      color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      body: BODIES[Math.floor(Math.random() * BODIES.length)]
    });
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c * k)));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

// Рисуем машину носом вверх в начале координат, а встречные разворачиваем
// поворотом холста. Иначе каждую деталь пришлось бы считать в двух вариантах.
function drawBody(b, color){
  const w = CAR_W, h = CAR_H, hw = w / 2, hh = h / 2;
  const [c0, c1] = b.cabin;
  const glass = "#1b2430";

  // колёса — чуть выступают из-под кузова
  ctx.fillStyle = "#15171c";
  for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
    roundRect(sx * hw - (sx < 0 ? 3 : w * .12 - 3), -hh + h * (sy < 0 ? .13 : .68),
              w * .12, h * .19, 3);
    ctx.fill();
  }

  // Кузов: нос уже кормы, поэтому контур — трапеция, а не прямоугольник.
  // Той же формой рисуем тень: прямоугольная тень под сужающимся кузовом
  // выдаёт себя тёмным углом у переднего крыла.
  const fw = hw * b.noseF, rw = hw * b.noseR;
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(-fw + b.r, -hh);
    ctx.lineTo(fw - b.r, -hh);
    ctx.quadraticCurveTo(fw, -hh, fw, -hh + b.r);
    ctx.lineTo(rw, hh - b.r);
    ctx.quadraticCurveTo(rw, hh, rw - b.r, hh);
    ctx.lineTo(-rw + b.r, hh);
    ctx.quadraticCurveTo(-rw, hh, -rw, hh - b.r);
    ctx.lineTo(-fw, -hh + b.r);
    ctx.quadraticCurveTo(-fw, -hh, -fw + b.r, -hh);
    ctx.closePath();
  };

  ctx.save();
  ctx.translate(2, 4);
  path(); ctx.fillStyle = "rgba(0,0,0,.42)"; ctx.fill();
  ctx.restore();

  path();
  const g = ctx.createLinearGradient(-hw, 0, hw, 0);
  g.addColorStop(0, shade(color, .78));
  g.addColorStop(.35, color);
  g.addColorStop(.62, shade(color, 1.12));
  g.addColorStop(1, shade(color, .72));
  ctx.fillStyle = g; ctx.fill();

  // кузов пикапа: открытый борт вместо крыши
  if (b.bed){
    ctx.fillStyle = shade(color, .55);
    roundRect(-hw * .74, -hh + h * .58, w * .74, h * .3, 4); ctx.fill();
  }

  // остекление: лобовое, крыша, заднее
  const cy0 = -hh + h * c0, cy1 = -hh + h * c1, cw = hw * b.cabW;
  ctx.fillStyle = glass;
  ctx.beginPath();
  ctx.moveTo(-cw * .74, cy0); ctx.lineTo(cw * .74, cy0);
  ctx.lineTo(cw, cy0 + h * .11); ctx.lineTo(-cw, cy0 + h * .11);
  ctx.closePath(); ctx.fill();
  if (!b.bed){
    ctx.beginPath();
    ctx.moveTo(-cw, cy1 - h * .1); ctx.lineTo(cw, cy1 - h * .1);
    ctx.lineTo(cw * .78, cy1); ctx.lineTo(-cw * .78, cy1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = shade(color, 1.02);
    roundRect(-cw * .92, cy0 + h * .11, cw * 1.84, (cy1 - h * .1) - (cy0 + h * .11), 3);
    ctx.fill();
  }

  // зеркала
  ctx.fillStyle = shade(color, .7);
  roundRect(-hw - 2, cy0 + h * .02, 5, 7, 2); ctx.fill();
  roundRect(hw - 3, cy0 + h * .02, 5, 7, 2); ctx.fill();

  if (b.rails){                       // рейлинги внедорожника
    ctx.fillStyle = shade(color, .6);
    roundRect(-cw * .95, cy0 + h * .12, 3, h * .34, 1.5); ctx.fill();
    roundRect(cw * .95 - 3, cy0 + h * .12, 3, h * .34, 1.5); ctx.fill();
  }
  if (b.wing){                        // антикрыло спорткара
    ctx.fillStyle = shade(color, .6);
    roundRect(-rw * .9, hh - h * .12, rw * 1.8, 5, 2); ctx.fill();
  }

  // фары и фонари
  ctx.fillStyle = "#ffe9b0";
  roundRect(-fw + 4, -hh + 2, 11, 5, 2); ctx.fill();
  roundRect(fw - 15, -hh + 2, 11, 5, 2); ctx.fill();
  ctx.fillStyle = "#d8433a";
  roundRect(-rw + 4, hh - 7, 10, 4, 2); ctx.fill();
  roundRect(rw - 14, hh - 7, 10, 4, 2); ctx.fill();
}

function drawCar(x, y, color, body, facingUp){
  ctx.save();
  ctx.translate(x, y + CAR_H / 2);
  if (!facingUp) ctx.rotate(Math.PI);
  drawBody(body, color);
  ctx.restore();
}

function draw(){
  ctx.fillStyle = "#11131a"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#23262f"; ctx.fillRect(ROAD_X, 0, ROAD_W, H);

  // обочина
  ctx.fillStyle = "#31343d";
  ctx.fillRect(ROAD_X - 6, 0, 6, H); ctx.fillRect(ROAD_X + ROAD_W, 0, 6, H);

  // разметка
  ctx.strokeStyle = "#4a4f5c"; ctx.lineWidth = 4; ctx.setLineDash([26, 24]);
  ctx.lineDashOffset = -dash;
  for (let i = 1; i < LANES; i++){
    const x = ROAD_X + ROAD_W / LANES * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.setLineDash([]);

  cars.forEach(c => drawCar(laneX(c.lane), c.y, c.color, c.body, false));
  drawCar(carX, H - CAR_H - 40, "#48b0ff", BODIES[1], true);   // игрок — спорткар
}

function tick(now){
  if (state !== "play") return;
  const dt = Math.min((now - last) / 1000, .05); last = now;

  speed = Math.min(SPEED_MAX, speed + dt * ACCEL);
  dist += speed * dt; dash += speed * dt;
  score = Math.floor(dist / 10);
  $("score").textContent = score;

  carX += (laneX(lane) - carX) * Math.min(dt * 14, 1);

  spawnIn -= dt;
  if (spawnIn <= 0){ spawn(); spawnIn = gapPx() / speed; }

  const py = H - CAR_H - 40;
  for (const c of cars){
    c.y += speed * dt;
    const sameLane = Math.abs(laneX(c.lane) - carX) < CAR_W * .8;
    if (sameLane && c.y + CAR_H > py + 10 && c.y < py + CAR_H - 10){ crash(); return; }
  }
  cars = cars.filter(c => c.y < H + CAR_H);

  draw();
  requestAnimationFrame(tick);
}

function crash(){
  state = "over";
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("error"); } catch(e){} }
  ctx.fillStyle = "rgba(255,90,90,.28)"; ctx.fillRect(0, 0, W, H);

  const record = score > best;
  if (record){ best = score; store.set("race_best", best); }
  $("final").textContent = score;
  $("bestline").textContent = record ? "Новый личный рекорд" : "Рекорд: " + best;
  $("hi").textContent = best;
  $("saved").textContent = "";
  $("over").classList.add("on");
  send(score);
}

function play(){
  $("start").classList.remove("on"); $("over").classList.remove("on");
  $("hud").style.display = "flex"; $("hi").textContent = best;
  reset(); state = "play"; requestAnimationFrame(tick);
}

// --- отправка результата. initData подписан Telegram, сервер проверит подпись:
//     без этого счёт мог бы прислать кто угодно и любой.
async function send(value){
  if (!tg || !tg.initData){ $("saved").textContent = "Результат сохранён только здесь"; return; }
  try {
    const r = await fetch("/game/score", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ initData: tg.initData, score: value })
    });
    const d = await r.json();
    $("saved").textContent = d.status === "ok"
      ? (d.place ? "В таблице вы " + d.place + "-й" : "Результат засчитан")
      : "Результат не сохранился";
  } catch(e){ $("saved").textContent = "Результат не сохранился"; }
}

// --- управление
function steer(dir){ if (state === "play") lane = Math.max(0, Math.min(LANES - 1, lane + dir)); }
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") steer(-1);
  if (e.key === "ArrowRight" || e.key === "d") steer(1);
  if (e.key === " " && state !== "play") play();
});
let touchX = null;
cv.addEventListener("pointerdown", e => { touchX = e.clientX; });
cv.addEventListener("pointerup", e => {
  if (touchX === null) return;
  const dx = e.clientX - touchX;
  if (Math.abs(dx) > 24) steer(dx > 0 ? 1 : -1);          // свайп
  else steer(e.clientX < innerWidth / 2 ? -1 : 1);         // касание половины
  touchX = null;
});

$("go").onclick = play;
$("again").onclick = play;
$("close").onclick = () => { if (tg) tg.close(); };
$("hi").textContent = best;
draw();
</script>
</body>
</html>
