<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мультфильм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0d1017;color:#f2f3f5;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:14px}

  .bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);
    display:flex;gap:10px;align-items:center;justify-content:center;padding:0 18px}
  button{appearance:none;border:0;border-radius:12px;padding:12px 26px;font-size:16px;
    font-weight:600;color:#0b1220;background:#7cc4ff;cursor:pointer}
  button:active{transform:scale(.97)}
  button.ghost{background:transparent;color:#98a0b0;box-shadow:inset 0 0 0 1px #2a3040}
  .title{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;
    text-align:center;font-size:15px;font-weight:600;color:#c8cfdd;padding:0 20px}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:30px;text-align:center;color:#98a0b0}
</style>
</head>
<body>
<div class="title" id="title"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="bar" id="bar" style="display:none">
  <button id="replay">↻ Сначала</button>
  <button class="ghost" id="close">Закрыть</button>
</div>
<div class="msg" id="msg">Загружаю…</div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg){ tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

// Сцена живёт в постоянных координатах, а на экран вписывается целиком:
// иначе на узком телефоне персонажи уезжают за край.
const W = 420, H = 620;
function fit(){
  const scale = Math.min(innerWidth / W, (innerHeight - 130) / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", fit); fit();

const GROUND = H * .72;
const rnd = (s) => { let x = Math.sin(s) * 10000; return x - Math.floor(x); };

// ---------- задники ----------
const SKIES = {
  meadow:["#8fd3ff","#dff3d8"], forest:["#7fc0e8","#cfe8c4"], city:["#9fb8d8","#e6e9f0"],
  room:["#f0dcc0","#e6cfae"],   night:["#131a33","#2a3358"], sea:["#8ad6f0","#d9f2fb"],
  space:["#080b1c","#1b1140"],  snow:["#cfe6f5","#f2f8fb"],
  castle:["#9db9d8","#dfe7ef"], throne:["#3a2a44","#5a4166"],
  cave:["#1b1a22","#332f3d"],   ruins:["#6b3f38","#c98a56"]
};
function backdrop(bg, t){
  const [a, b] = SKIES[bg] || SKIES.meadow;
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, a); g.addColorStop(1, b);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);

  // Под крышей неба нет: солнце с облаками в тронном зале выдают рисунок,
  // собранный не глядя.
  const indoor = bg === "room" || bg === "throne" || bg === "cave";
  if (indoor){
    /* небо не рисуем вовсе */
  } else if (bg === "night" || bg === "space"){
    for (let i = 0; i < 60; i++){
      const x = rnd(i) * W, y = rnd(i + 99) * GROUND;
      ctx.globalAlpha = .4 + rnd(i + 7) * .6;
      ctx.fillStyle = "#fff";
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#f4f1d0";
    ctx.beginPath(); ctx.arc(W * .78, GROUND * .22, 26, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "#ffe680";
    ctx.beginPath(); ctx.arc(W * .82, GROUND * .18, 30, 0, 7); ctx.fill();
    ctx.globalAlpha = .55; ctx.fillStyle = "#fff";
    for (const [cx, cy, s] of [[70,90,1],[300,60,.8],[190,130,.6]]){
      const dx = (t * 8 + cx) % (W + 120) - 60;
      ctx.beginPath();
      ctx.arc(dx, cy, 22*s, 0, 7); ctx.arc(dx+22*s, cy+4*s, 17*s, 0, 7);
      ctx.arc(dx-20*s, cy+5*s, 15*s, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  if (bg === "forest"){
    for (let i = 0; i < 7; i++){
      const x = 20 + i * 62 + rnd(i) * 20, h = 120 + rnd(i + 3) * 70;
      ctx.fillStyle = "#6b4a2f"; ctx.fillRect(x - 5, GROUND - h * .4, 10, h * .4);
      ctx.fillStyle = i % 2 ? "#2f8f4e" : "#3aa85c";
      ctx.beginPath(); ctx.arc(x, GROUND - h * .45, h * .3, 0, 7); ctx.fill();
    }
  }
  if (bg === "city"){
    for (let i = 0; i < 8; i++){
      const x = i * 55, h = 90 + rnd(i + 11) * 170;
      ctx.fillStyle = i % 2 ? "#5f6c85" : "#4d596f";
      ctx.fillRect(x, GROUND - h, 48, h);
      ctx.fillStyle = "#ffe08a";
      for (let r = 0; r < Math.floor(h / 28); r++)
        for (let c = 0; c < 3; c++)
          if (rnd(i * 40 + r * 4 + c) > .45)
            ctx.fillRect(x + 7 + c * 14, GROUND - h + 12 + r * 26, 7, 10);
    }
  }
  if (bg === "room"){
    ctx.fillStyle = "#cbb18d"; ctx.fillRect(0, GROUND - 150, W, 150);
    ctx.fillStyle = "#9fd0e8"; ctx.fillRect(W * .12, GROUND - 250, 110, 90);
    ctx.strokeStyle = "#8a6a45"; ctx.lineWidth = 6;
    ctx.strokeRect(W * .12, GROUND - 250, 110, 90);
  }

  if (bg === "castle"){
    ctx.fillStyle = "#7d8ea6";
    for (const [bx, bw, bh] of [[30,58,220],[W-88,58,220],[W*.5-70,140,150]]){
      ctx.fillRect(bx, GROUND - bh, bw, bh);
      ctx.fillStyle = "#6a7a90";
      for (let i = 0; i < bw / 20; i++) ctx.fillRect(bx + i * 20, GROUND - bh - 10, 12, 10);
      ctx.fillStyle = "#7d8ea6";
    }
    ctx.fillStyle = "#3b2f2a";
    ctx.beginPath(); ctx.moveTo(W*.5-26, GROUND); ctx.lineTo(W*.5-26, GROUND-64);
    ctx.quadraticCurveTo(W*.5, GROUND-104, W*.5+26, GROUND-64);
    ctx.lineTo(W*.5+26, GROUND); ctx.closePath(); ctx.fill();
  }
  if (bg === "throne"){
    ctx.fillStyle = "#2c2036"; ctx.fillRect(0, GROUND - 300, W, 300);
    for (const cx of [W*.16, W*.84]){         // колонны
      ctx.fillStyle = "#4b3a58"; ctx.fillRect(cx - 20, GROUND - 300, 40, 300);
      ctx.fillStyle = "#5d4a6c"; ctx.fillRect(cx - 26, GROUND - 300, 52, 16);
    }
    ctx.fillStyle = "#7a2f3a";                // ковровая дорожка
    ctx.beginPath(); ctx.moveTo(W*.36, GROUND - 120); ctx.lineTo(W*.64, GROUND - 120);
    ctx.lineTo(W*.82, H); ctx.lineTo(W*.18, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9a227";                // трон
    ctx.fillRect(W*.44, GROUND - 190, 52, 74);
    ctx.fillRect(W*.42, GROUND - 120, 56, 14);
  }
  if (bg === "cave"){
    ctx.fillStyle = "#26232e";
    for (let i = 0; i < 9; i++){               // сталактиты
      const x = i * 50 + rnd(i) * 20, h = 40 + rnd(i + 5) * 70;
      ctx.beginPath(); ctx.moveTo(x - 16, 0); ctx.lineTo(x + 16, 0);
      ctx.lineTo(x, h); ctx.closePath(); ctx.fill();
    }
  }
  if (bg === "ruins"){
    ctx.fillStyle = "#4a3a35";
    for (let i = 0; i < 6; i++){
      const x = 15 + i * 70, h = 50 + rnd(i + 21) * 120;
      ctx.fillRect(x, GROUND - h, 40, h);
      ctx.fillStyle = "#3a2d29";
      ctx.fillRect(x, GROUND - h, 40, 8);
      ctx.fillStyle = "#4a3a35";
    }
    ctx.globalAlpha = .5; ctx.fillStyle = "#7a6a60";   // дым
    for (let i = 0; i < 5; i++){
      const x = rnd(i + 3) * W, y = GROUND - 140 - rnd(i) * 90;
      ctx.beginPath(); ctx.arc(x, y + (t * 6) % 60, 26 + rnd(i + 9) * 16, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // земля
  const ground = {meadow:"#5fbf68", forest:"#4e9e57", city:"#59606f", room:"#8a6a45",
                  night:"#2b3350", sea:"#e8dca8", space:"#241a4a", snow:"#eef6fb",
                  castle:"#6f8a5e", throne:"#3a2c47", cave:"#2a2733",
                  ruins:"#5a4038"}[bg] || "#5fbf68";
  ctx.fillStyle = ground; ctx.fillRect(0, GROUND, W, H - GROUND);
  if (bg === "sea"){
    ctx.fillStyle = "#2ba3d6"; ctx.fillRect(0, GROUND - 34, W, 34);
  }
}

// ---------- персонажи ----------
function shade(hex, k){
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * k)));
  return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`;
}

// Персонажи собираются из общего набора частей: силуэт тела, форма головы,
// уши, рога, корона, борода, крылья, хвост. Шестнадцать видов — это шестнадцать
// сочетаний, а не шестнадцать отдельных рисунков; новый вид стоит одной строки.
const KIND = {
  girl:    {body:"dress", head:"round", hair:"long"},
  boy:     {body:"torso", head:"round", hair:"short"},
  princess:{body:"dress", head:"round", hair:"long", crown:true},
  king:    {body:"robe",  head:"round", beard:true, crown:true},
  knight:  {body:"torso", head:"helm",  metal:true},
  wizard:  {body:"robe",  head:"round", beard:true, hat:true},
  dragon:  {body:"beast", head:"snout", horns:true, wings:true, tail:"spiky", spikes:true},
  monster: {body:"beast", head:"round", horns:true, teeth:true, tail:"thin"},
  cat:     {body:"beast", head:"round", ears:"pointed", tail:"thin"},
  dog:     {body:"beast", head:"snout", ears:"floppy", tail:"thin"},
  bear:    {body:"beast", head:"round", ears:"round"},
  rabbit:  {body:"beast", head:"round", ears:"long", tail:"puff"},
  horse:   {body:"beast", head:"snout", mane:true, tail:"thin", hooves:true},
  bird:    {body:"oval",  head:"round", beak:true, wings:true},
  fish:    {body:"fish",  head:"none"},
  robot:   {body:"box",   head:"box",   antenna:true, metal:true},
};

const SCALE = 1.25;     // персонажи должны занимать кадр, а не теряться в небе

function outline(){ ctx.strokeStyle = "rgba(28,32,40,.55)"; ctx.lineWidth = 2; ctx.stroke(); }

// Мимика — половина смысла в грустной или гневной сцене, поэтому глаза, брови
// и рот считаются из настроения, а не рисуются одной дежурной улыбкой.
function face(hy, hr, mood, blink){
  const eyeY = hy - hr * .12, dx = hr * .34;

  ctx.fillStyle = "#22252c";
  if (mood === "scared"){
    ctx.beginPath(); ctx.arc(-dx, eyeY, hr * .2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(dx, eyeY, hr * .2, 0, 7); ctx.fill();
  } else if (blink){
    ctx.strokeStyle = "#22252c"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-dx - 3, eyeY); ctx.lineTo(-dx + 3, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dx - 3, eyeY); ctx.lineTo(dx + 3, eyeY); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-dx, eyeY, hr * .15, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(dx, eyeY, hr * .15, 0, 7); ctx.fill();
  }

  // брови: наклон и есть выражение
  const brow = {happy:-.15, calm:0, sad:.45, angry:-.6, scared:.35}[mood] ?? 0;
  if (mood !== "calm"){
    ctx.strokeStyle = "#22252c"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-dx - hr * .22, eyeY - hr * .38 + brow * 6);
    ctx.lineTo(-dx + hr * .22, eyeY - hr * .38 - brow * 6); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(dx - hr * .22, eyeY - hr * .38 - brow * 6);
    ctx.lineTo(dx + hr * .22, eyeY - hr * .38 + brow * 6); ctx.stroke();
  }

  // рот
  ctx.strokeStyle = "#22252c"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
  const my = hy + hr * .35;
  ctx.beginPath();
  if (mood === "sad")        ctx.arc(0, my + hr * .3, hr * .3, Math.PI + .3, -.3);
  else if (mood === "angry") ctx.arc(0, my + hr * .28, hr * .28, Math.PI + .35, -.35);
  else if (mood === "scared"){ ctx.ellipse(0, my, hr * .16, hr * .22, 0, 0, 7); ctx.fillStyle = "#22252c"; ctx.fill(); }
  else if (mood === "happy") ctx.arc(0, my - hr * .12, hr * .34, .25, Math.PI - .25);
  else                       ctx.arc(0, my - hr * .05, hr * .22, .35, Math.PI - .35);
  ctx.stroke();
}

function actor(a, x, y, phase, action, mood){
  const k = KIND[a.kind] || KIND.girl;
  const size = (a.size || 1) * SCALE;
  const bob = action === "walk" ? Math.sin(phase * 9) * 3
            : action === "fly"  ? Math.sin(phase * 4) * 9 : Math.sin(phase * 2) * 1.5;
  const jump = action === "jump" ? Math.abs(Math.sin(phase * 6)) * 36 : 0;
  const hover = action === "fly" ? 46 : 0;
  const tilt = action === "shake" ? Math.sin(phase * 22) * .12 : 0;
  const grow = action === "grow" ? 1 + Math.min(.45, phase * .22) : 1;
  const blink = (phase * 1000 | 0) % 3200 < 130;

  ctx.save();
  ctx.translate(x, y - jump - hover + bob);

  // тень падает на землю и не едет вслед за прыжком — по ней и видно высоту
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath();
  ctx.ellipse(0, jump + hover + 4, 26 * size, 7 * size, 0, 0, 7); ctx.fill();

  ctx.rotate(tilt);
  ctx.scale(grow * size * (a.face === -1 ? -1 : 1), grow * size);

  const beast = k.body === "beast", fish = k.body === "fish";
  const bodyH = fish ? 34 : k.body === "oval" ? 36 : 48;
  const bodyW = fish ? 48 : beast ? 40 : 34;
  const dark = shade(a.color, .72), light = shade(a.color, 1.12);

  // ---- хвост (за телом)
  if (k.tail){
    ctx.fillStyle = dark;
    if (k.tail === "puff"){ ctx.beginPath(); ctx.arc(-bodyW * .55, -bodyH * .3, 8, 0, 7); ctx.fill(); }
    else if (k.tail === "spiky"){
      ctx.beginPath();
      ctx.moveTo(-bodyW * .4, -bodyH * .55);
      ctx.quadraticCurveTo(-bodyW * 1.5, -bodyH * .5, -bodyW * 1.3, -4);
      ctx.quadraticCurveTo(-bodyW * 1.1, -bodyH * .35, -bodyW * .4, -bodyH * .3);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = dark; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-bodyW * .4, -bodyH * .5);
      ctx.quadraticCurveTo(-bodyW * 1.1, -bodyH * .9, -bodyW * .9, -bodyH * .2);
      ctx.stroke();
    }
  }

  // ---- крылья (за телом)
  if (k.wings){
    const flap = action === "fly" ? Math.sin(phase * 8) * .5 : .12;
    ctx.fillStyle = shade(a.color, .82);
    for (const s of [-1, 1]){
      ctx.save(); ctx.translate(s * bodyW * .32, -bodyH * .82); ctx.rotate(s * (.5 + flap));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 34, -26, s * 46, 4);
      ctx.quadraticCurveTo(s * 26, 2, 0, 14);
      ctx.closePath(); ctx.fill(); outline();
      ctx.restore();
    }
  }

  // ---- ноги
  if (!fish && k.body !== "oval"){
    const swing = action === "walk" ? Math.sin(phase * 9) * 8 : 0;
    ctx.strokeStyle = dark; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-8, -10); ctx.lineTo(-8 + swing, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -10); ctx.lineTo(8 - swing, 2); ctx.stroke();
    if (k.hooves){
      ctx.fillStyle = "#33302c";
      ctx.beginPath(); ctx.arc(-8 + swing, 2, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(8 - swing, 2, 4, 0, 7); ctx.fill();
    }
  }

  // ---- тело
  ctx.fillStyle = a.color;
  ctx.beginPath();
  if (k.body === "dress" || k.body === "robe"){
    const flare = k.body === "robe" ? .95 : .8;
    ctx.moveTo(-bodyW * .3, -bodyH);
    ctx.lineTo(bodyW * .3, -bodyH);
    ctx.lineTo(bodyW * flare, 0);
    ctx.lineTo(-bodyW * flare, 0);
    ctx.closePath();
  } else if (k.body === "box"){
    ctx.rect(-bodyW * .45, -bodyH, bodyW * .9, bodyH);
  } else if (beast){
    ctx.ellipse(0, -bodyH * .5, bodyW * .5, bodyH * .52, 0, 0, 7);
  } else {
    ctx.ellipse(0, -bodyH * .5, bodyW * .42, bodyH * .5, 0, 0, 7);
  }
  ctx.fill(); outline();

  if (k.metal){                       // блик на металле
    ctx.globalAlpha = .3; ctx.fillStyle = "#fff";
    ctx.fillRect(-bodyW * .3, -bodyH * .85, 5, bodyH * .6);
    ctx.globalAlpha = 1;
  }
  if (k.spikes){                      // гребень по спине
    ctx.fillStyle = light;
    for (let i = 0; i < 3; i++){
      const sy = -bodyH * (.85 - i * .22);
      ctx.beginPath(); ctx.moveTo(-bodyW * .48, sy);
      ctx.lineTo(-bodyW * .68, sy - 7); ctx.lineTo(-bodyW * .44, sy - 9);
      ctx.closePath(); ctx.fill();
    }
  }

  // ---- руки
  if (!fish && k.body !== "oval"){
    const swing = action === "wave" ? Math.sin(phase * 10) * .9 - .7
                : action === "walk" ? Math.sin(phase * 9) * .5 : .18;
    ctx.strokeStyle = a.color; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-bodyW * .38, -bodyH * .72);
    ctx.lineTo(-bodyW * .38 - 16 * Math.cos(swing), -bodyH * .72 + 16 * Math.sin(swing));
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bodyW * .38, -bodyH * .72);
    ctx.lineTo(bodyW * .38 + 15, -bodyH * .72 + 11); ctx.stroke();
  }
  if (fish){
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(bodyW * .42, -bodyH * .5);
    ctx.lineTo(bodyW * .8, -bodyH * .95); ctx.lineTo(bodyW * .8, -bodyH * .05);
    ctx.closePath(); ctx.fill();
  }

  // ---- голова
  const hy = -bodyH - (fish ? -bodyH * .5 : 17), hr = k.head === "none" ? 0 : 18;
  if (k.head === "none"){                       // у рыбы морда на теле
    ctx.fillStyle = "#22252c";
    ctx.beginPath(); ctx.arc(-bodyW * .18, -bodyH * .62, 3, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }

  // уши и рога рисуем до головы, чтобы они выходили из-за неё
  if (k.ears === "long"){
    ctx.fillStyle = a.color;
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(s * hr * .45, hy - hr * 1.35, 5, 17, s * .18, 0, 7);
      ctx.fill(); outline();
    }
  }
  if (k.horns){
    ctx.fillStyle = "#e8e0cf";
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s * hr * .55, hy - hr * .72);
      ctx.quadraticCurveTo(s * hr * 1.25, hy - hr * 1.5, s * hr * .78, hy - hr * 1.75);
      ctx.quadraticCurveTo(s * hr * .82, hy - hr * 1.1, s * hr * .3, hy - hr * .82);
      ctx.closePath(); ctx.fill();
    }
  }

  ctx.fillStyle = light;
  ctx.beginPath();
  if (k.head === "box") ctx.rect(-hr, hy - hr, hr * 2, hr * 1.9);
  else if (k.head === "helm") ctx.arc(0, hy, hr, 0, 7);
  else ctx.arc(0, hy, hr, 0, 7);
  ctx.fill(); outline();

  if (k.head === "snout"){
    ctx.fillStyle = light;
    ctx.beginPath();
    ctx.ellipse(hr * .72, hy + hr * .28, hr * .58, hr * .38, 0, 0, 7);
    ctx.fill(); outline();
    ctx.fillStyle = "#22252c";
    ctx.beginPath(); ctx.arc(hr * 1.18, hy + hr * .2, 2.6, 0, 7); ctx.fill();
  }
  if (k.ears === "pointed"){
    ctx.fillStyle = light;
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s * hr * .9, hy - hr * .5); ctx.lineTo(s * hr * .55, hy - hr * 1.45);
      ctx.lineTo(s * hr * .12, hy - hr * .78); ctx.closePath();
      ctx.fill(); outline();
    }
  }
  if (k.ears === "round"){
    ctx.fillStyle = light;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.arc(s * hr * .78, hy - hr * .75, 8, 0, 7);
      ctx.fill(); outline();
    }
  }
  if (k.ears === "floppy"){
    ctx.fillStyle = shade(a.color, .9);
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.ellipse(s * hr * .92, hy + hr * .1, 6, 13, s * .25, 0, 7);
      ctx.fill(); outline();
    }
  }
  if (k.hair === "long"){
    ctx.fillStyle = shade(a.color, .55);
    ctx.beginPath(); ctx.arc(0, hy - 3, hr + 4, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-hr, hy + hr * .55, 6, 18, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hr, hy + hr * .55, 6, 18, 0, 0, 7); ctx.fill();
  }
  if (k.hair === "short"){
    ctx.fillStyle = shade(a.color, .55);
    ctx.beginPath(); ctx.arc(0, hy - 4, hr + 1, Math.PI + .3, -.3); ctx.fill();
  }
  if (k.mane){
    ctx.fillStyle = shade(a.color, .5);
    ctx.beginPath(); ctx.moveTo(-hr * .5, hy - hr);
    ctx.quadraticCurveTo(-hr * 1.6, hy + hr * .4, -hr * .7, hy + hr * 1.5);
    ctx.quadraticCurveTo(-hr * .2, hy + hr * .3, -hr * .2, hy - hr * .9);
    ctx.closePath(); ctx.fill();
  }
  if (k.beard){
    ctx.fillStyle = "#d8dce3";
    ctx.beginPath();
    ctx.moveTo(-hr * .62, hy + hr * .5);
    ctx.quadraticCurveTo(0, hy + hr * 1.75, hr * .62, hy + hr * .5);
    ctx.quadraticCurveTo(0, hy + hr * .95, -hr * .62, hy + hr * .5);
    ctx.closePath(); ctx.fill(); outline();
  }
  if (k.crown){
    ctx.fillStyle = "#ffd34d";
    ctx.beginPath();
    ctx.moveTo(-hr * .85, hy - hr * .78); ctx.lineTo(-hr * .85, hy - hr * 1.5);
    ctx.lineTo(-hr * .4, hy - hr * 1.1); ctx.lineTo(0, hy - hr * 1.7);
    ctx.lineTo(hr * .4, hy - hr * 1.1); ctx.lineTo(hr * .85, hy - hr * 1.5);
    ctx.lineTo(hr * .85, hy - hr * .78);
    ctx.closePath(); ctx.fill(); outline();
  }
  if (k.hat){
    // Шляпа должна сидеть на голове, а не парить над ней: поля заходят
    // на макушку, а не начинаются выше её.
    ctx.fillStyle = shade(a.color, .5);
    ctx.beginPath();
    ctx.moveTo(-hr * 1.25, hy - hr * .5); ctx.lineTo(hr * 1.25, hy - hr * .5);
    ctx.lineTo(hr * .12, hy - hr * 2.2); ctx.closePath();
    ctx.fill(); outline();
  }
  if (k.beak){
    ctx.fillStyle = "#ffb02e";
    ctx.beginPath(); ctx.moveTo(hr * .75, hy);
    ctx.lineTo(hr * 1.8, hy + 4); ctx.lineTo(hr * .75, hy + 8);
    ctx.closePath(); ctx.fill();
  }
  if (k.antenna){
    ctx.strokeStyle = dark; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, hy - hr); ctx.lineTo(0, hy - hr - 10); ctx.stroke();
    ctx.fillStyle = "#ffd85e";
    ctx.beginPath(); ctx.arc(0, hy - hr - 12, 4, 0, 7); ctx.fill();
  }
  if (k.teeth){
    ctx.fillStyle = "#fff";
    for (const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s * hr * .3, hy + hr * .45); ctx.lineTo(s * hr * .5, hy + hr * .45);
      ctx.lineTo(s * hr * .4, hy + hr * .8); ctx.closePath(); ctx.fill();
    }
  }

  if (k.head === "helm"){
    // Под забралом лица нет — только прорезь и блеск глаз. Обычная улыбка
    // на рыцарском шлеме выглядит ошибкой, а не характером.
    ctx.fillStyle = "#8c95a3";
    ctx.beginPath(); ctx.arc(0, hy - hr * .15, hr * .96, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#22252c";
    ctx.fillRect(-hr * .72, hy - hr * .18, hr * 1.44, hr * .34);
    ctx.fillStyle = mood === "angry" ? "#ff8f6b" : "#cfe3ff";
    ctx.fillRect(-hr * .42, hy - hr * .1, 5, 5);
    ctx.fillRect(hr * .18, hy - hr * .1, 5, 5);
    ctx.strokeStyle = "#6d7684"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, hy + hr * .2); ctx.lineTo(0, hy + hr * .85); ctx.stroke();
  } else {
    face(hy, hr, mood || "calm", blink);
  }

  // огненное дыхание — единственное, что дракон умеет и чего не умеют прочие
  if (action === "breathe"){
    const len = 30 + Math.sin(phase * 12) * 10;
    const g = ctx.createLinearGradient(hr, hy, hr + len * 2.2, hy);
    g.addColorStop(0, "#ffd34d"); g.addColorStop(.5, "#ff7a1e"); g.addColorStop(1, "rgba(255,60,20,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(hr * 1.1, hy - 6);
    ctx.quadraticCurveTo(hr + len * 1.6, hy - 22, hr + len * 2.2, hy + 2);
    ctx.quadraticCurveTo(hr + len * 1.6, hy + 26, hr * 1.1, hy + 10);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

function bubble(x, y, text){
  ctx.font = "600 14px -apple-system,Segoe UI,Roboto,sans-serif";
  const words = text.split(" ");
  const lines = []; let line = "";
  for (const w of words){
    if (ctx.measureText(line + " " + w).width > 150 && line){ lines.push(line); line = w; }
    else line = line ? line + " " + w : w;
  }
  if (line) lines.push(line);

  const wdt = Math.max(...lines.map(l => ctx.measureText(l).width)) + 22;
  const hgt = lines.length * 18 + 16;
  const bx = Math.max(6, Math.min(W - wdt - 6, x - wdt / 2)), by = y - hgt - 12;

  ctx.fillStyle = "rgba(255,255,255,.96)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(bx, by, wdt, hgt, 12) : ctx.rect(bx, by, wdt, hgt);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 7, by + hgt); ctx.lineTo(x, by + hgt + 10); ctx.lineTo(x + 7, by + hgt);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = "#1d2129"; ctx.textAlign = "center";
  lines.forEach((l, i) => ctx.fillText(l, bx + wdt / 2, by + 22 + i * 18));
  ctx.textAlign = "left";
}

function caption(text){
  if (!text) return;
  ctx.font = "500 14px -apple-system,Segoe UI,Roboto,sans-serif";
  const wdt = Math.min(W - 28, ctx.measureText(text).width + 26);
  ctx.fillStyle = "rgba(10,13,20,.72)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect((W - wdt) / 2, H - 52, wdt, 34, 10)
                : ctx.rect((W - wdt) / 2, H - 52, wdt, 34);
  ctx.fill();
  ctx.fillStyle = "#eef1f6"; ctx.textAlign = "center";
  ctx.fillText(text, W / 2, H - 30);
  ctx.textAlign = "left";
}

// ---------- проигрыватель ----------
const BEAT = 2.6;                 // секунд на действие
let film = null, t0 = 0, playing = false;

function totalTime(){
  return film.scenes.reduce((s, sc) => s + Math.max(1, sc.beats.length) * BEAT, 0);
}

function frame(now){
  if (!playing) return;
  const t = (now - t0) / 1000;

  // ищем текущую сцену и такт
  let acc = 0, scene = null, local = 0;
  for (const sc of film.scenes){
    const dur = Math.max(1, sc.beats.length) * BEAT;
    if (t < acc + dur){ scene = sc; local = t - acc; break; }
    acc += dur;
  }
  if (!scene){ finish(); return; }

  const bi = Math.min(scene.beats.length - 1, Math.floor(local / BEAT));
  const beat = scene.beats[bi] || null;
  const inBeat = (local % BEAT) / BEAT;

  backdrop(scene.bg, t);

  // положение каждого персонажа: до своего такта стоит, в такте идёт
  for (const a of scene.actors){
    // Настроение держится до следующей своей реплики, а не гаснет вместе с
    // тактом: обиженный персонаж не веселеет оттого, что заговорил другой.
    let x = a.x, action = "idle", mood = "calm";
    for (let i = 0; i <= bi; i++){
      const b = scene.beats[i];
      if (!b || b.actor !== a.id) continue;
      if (b.action === "walk"){
        const p = i === bi ? inBeat : 1;
        x = a.x + (b.to - a.x) * p;
        if (i < bi) a.x = b.to;              // дошёл — закрепляем
      }
      mood = b.mood || "calm";
      if (i === bi) action = b.action;
    }
    a.face = beat && beat.actor === a.id && beat.action === "turn" ? -1 : 1;
    actor(a, x * W, GROUND + 6, t, action, mood);
    if (beat && beat.actor === a.id && beat.say)
      bubble(x * W, GROUND - 128, beat.say);
  }

  caption(scene.narration);

  // затемнение на стыке сцен
  const dur = Math.max(1, scene.beats.length) * BEAT;
  const edge = Math.min(local, dur - local);
  if (edge < .35){
    ctx.fillStyle = `rgba(8,10,16,${(1 - edge / .35) * .8})`;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(frame);
}

function finish(){
  playing = false;
  ctx.fillStyle = "rgba(8,10,16,.82)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#eef1f6"; ctx.textAlign = "center";
  ctx.font = "700 24px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.fillText("Конец", W / 2, H / 2);
  ctx.textAlign = "left";
}

function start(){
  // Персонажи двигаются по ходу дела, поэтому каждый показ начинаем
  // с чистой копии: иначе повтор играет с того места, где кончил прошлый.
  film = JSON.parse(film.source);
  film.source = JSON.stringify(film);
  playing = true; t0 = performance.now();
  requestAnimationFrame(frame);
}

async function load(){
  const id = new URLSearchParams(location.search).get("id");
  if (!id){ $("msg").textContent = "Не указан мультфильм."; return; }
  try {
    const r = await fetch("/cartoon/data?id=" + encodeURIComponent(id));
    const d = await r.json();
    if (d.status !== "ok") throw new Error(d.message || "нет данных");
    film = d.film; film.source = JSON.stringify(d.film);
    $("msg").style.display = "none";
    $("bar").style.display = "flex";
    $("title").textContent = film.title || "";
    start();
  } catch(e){
    $("msg").textContent = "Мультфильм не загрузился.";
  }
}

$("replay").onclick = start;
$("close").onclick = () => { if (tg) tg.close(); };
load();
</script>
